name: build-publish
on:
  workflow_dispatch:
    inputs:
      imageName:
        required: false
        description: "Image Name. Omit if there is no Docker image to build."
        type: string
        default: ''
      argoCdRepoName:
        required: false
        description: "ArgoCD repo name. Omit if no image."
        type: string
        default: ''
      minimumCoverage:
        required: false
        description: "Minimum code coverage percentage"
        type: number
        default: 0
      testProjectPath:
        required: false
        description: "Test project discovery is from the solution if this is not set."
        default: "."
        type: string
      migrationsDockerfileContext:
        required: false
        description: "The build context for the migrations Docker image. Relative to repository root."
        type: string
        default: '.'
      migrationsDockerfilePath:
        required: false
        description: "The path to the Dockerfile relative to the build context."
        type: string
        default: ''
      dockerfilePath:
        required: false
        description: "Path to the Dockerfile for the main image build. Relative to repository root."
        type: string
        default: './Dockerfile'
      folderName:
        required: false
        description: "ArgoCD helm-values folder name. Defaults to repository name."
        type: string
        default: ''
      slsa:
        required: false
        default: false
        description: "flag to enable slsa"
        type: boolean
      runner:
        required: false
        description: "GitHub Actions runner label. Use a larger runner label to avoid OOM on large builds."
        type: string
        default: 'ubuntu-latest'
      nugetFeedOrganization:
        required: false
        description: "GitHub organization whose GitHub Packages NuGet feed is added before restore. Empty means use the repo's own NuGet config only."
        type: string
        default: ''
      nugetPushOrganization:
        required: false
        description: "GitHub organization whose GitHub Packages feed receives NuGet packages on main and tags. Defaults to the repository owner."
        type: string
        default: ''
      nugetPackagesPath:
        required: false
        description: "Directory holding the built .nupkg files. Empty keeps the bin/Release search."
        type: string
        default: ''
      testArguments:
        required: false
        description: "Extra dotnet test arguments when global.json selects Microsoft.Testing.Platform."
        type: string
        default: ''

  workflow_call:
    inputs:
      imageName:
        required: false
        description: "Image Name. Omit if there is no Docker image to build."
        type: string
        default: ''
      argoCdRepoName:
        required: false
        description: "ArgoCD repo name. Omit if no image."
        type: string
        default: ''
      minimumCoverage:
        required: false
        description: "Minimum code coverage percentage"
        type: number
        default: 0
      testProjectPath:
        required: false
        description: "Test project discovery is from the solution if this is not set."
        default: "."
        type: string
      migrationsDockerfileContext:
        required: false
        description: "The build context for the migrations Docker image. Relative to repository root."
        type: string
        default: '.'
      migrationsDockerfilePath:
        required: false
        description: "The path to the Dockerfile relative to the build context."
        type: string
        default: ''
      dockerfilePath:
        required: false
        description: "Path to the Dockerfile for the main image build. Relative to repository root."
        type: string
        default: './Dockerfile'
      folderName:
        required: false
        description: "ArgoCD helm-values folder name. Defaults to repository name."
        type: string
        default: ''
      slsa:
        required: false
        default: false
        description: "flag to enable slsa"
        type: boolean
      runner:
        required: false
        description: "GitHub Actions runner label. Use a larger runner label to avoid OOM on large builds."
        type: string
        default: 'ubuntu-latest'
      nugetFeedOrganization:
        required: false
        description: "GitHub organization whose GitHub Packages NuGet feed is added before restore. Empty means use the repo's own NuGet config only."
        type: string
        default: ''
      nugetPushOrganization:
        required: false
        description: "GitHub organization whose GitHub Packages feed receives NuGet packages on main and tags. Defaults to the repository owner."
        type: string
        default: ''
      nugetPackagesPath:
        required: false
        description: "Directory holding the built .nupkg files. Empty keeps the bin/Release search."
        type: string
        default: ''
      testArguments:
        required: false
        description: "Extra dotnet test arguments when global.json selects Microsoft.Testing.Platform."
        type: string
        default: ''

    secrets:
      githubToken:
        description: "Github token"
        required: true
      cosignKey:
        description: "Cosign key (only used when imageName is set)"
        required: false
      cosignPassword:
        description: "Cosign password (only used when imageName is set)"
        required: false

concurrency:
  group: build-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  version:
    uses: stand-sure-org/Oui-DELIVER/.github/workflows/semver.yml@feat/dotnet11-standalone
    permissions:
      contents: read

  detect:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      has_docker: ${{ steps.detect.outputs.has_docker }}
      has_nuget: ${{ steps.detect.outputs.has_nuget }}
      has_package: ${{ steps.detect.outputs.has_package }}
      is_release: ${{ steps.detect.outputs.is_release }}
      skip_tests: ${{ steps.detect.outputs.skip_tests }}
    steps:
      - name: Detect build type
        id: detect
        uses: stand-sure-org/Oui-DELIVER/.github/actions/detect-build-type@feat/dotnet11-standalone

  build:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      pull-requests: write
    needs: [version, detect]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build and Test
        # Skip on release for Docker-only repos (tests already passed in PR)
        if: needs.detect.outputs.skip_tests != 'true'
        uses: stand-sure-org/Oui-DELIVER/.github/actions/build-dotnet@feat/dotnet11-standalone
        with:
          version: ${{ needs.version.outputs.version }}
          githubToken: "${{ secrets.GITHUB_TOKEN }}"
          minimumCoverage: "${{ inputs.minimumCoverage }}"
          testProjectPath: "${{ inputs.testProjectPath }}"
          organization: "${{ inputs.nugetFeedOrganization }}"
          testArguments: "${{ inputs.testArguments }}"

      - name: Build only (no tests - Docker-only release)
        # Skip tests on release for Docker-only repos:
        # - Tests already passed during PR (required check)
        # - No packages to publish that could break downstream consumers
        # - Docker image will be rebuilt anyway
        # Cost savings: ~2-5 min per deployment for services with test suites
        if: needs.detect.outputs.skip_tests == 'true'
        shell: bash
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NuGetPackageSourceCredentials_github: "Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}"
          NUGET_FEED_ORG: ${{ inputs.nugetFeedOrganization }}
        run: |
          echo "::notice::Skipping tests (Docker-only on release, tests passed in PR)"
          if [[ -n "${NUGET_FEED_ORG}" ]]; then
            dotnet nuget add source \
              --name "github" \
              "https://nuget.pkg.github.com/${NUGET_FEED_ORG}/index.json" || true
          fi
          dotnet restore
          dotnet build --configuration Release --no-restore

      - name: Push Nuget packages
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && needs.detect.outputs.has_nuget == 'true'
        uses: stand-sure-org/Oui-DELIVER/.github/actions/push-nuget-packages@feat/dotnet11-standalone
        with:
          pushToken: "${{ secrets.githubToken }}"
          organization: "${{ inputs.nugetPushOrganization || github.repository_owner }}"
          searchPath: "${{ inputs.nugetPackagesPath }}"

      - name: Generate SBOM
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: stand-sure-org/Oui-DELIVER/.github/actions/generate-sbom-dotnet@feat/dotnet11-standalone

      - name: Upload SBOMs
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: out/
          overwrite: 'true'
          name: 'build-artifact'

      - name: Publish Container Image
        if: inputs.imageName != ''
        uses: stand-sure-org/Oui-DELIVER/.github/actions/build-publish-sign-docker@feat/dotnet11-standalone
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.githubToken }}
          version: ${{ needs.version.outputs.version }}
          imageName: ${{ inputs.imageName }}
          organizationName: ${{ github.repository_owner }}
          imageTitle: ${{ github.event.repository.name }}
          imageDescription: ${{ github.event.repository.description }}
          repositoryUrl: ${{ github.event.repository.html_url }}
          sha: ${{ github.sha }}
          cosignKey: ${{ secrets.cosignKey }}
          cosignPassword: ${{ secrets.cosignPassword }}
          buildArgs: |
            NUGET_SOURCE_NAME=github
            NUGET_SOURCE_URL=https://nuget.pkg.github.com/${{ inputs.nugetFeedOrganization || github.repository_owner }}/index.json
            NUGET_USERNAME=${{ github.actor }}
          secrets: |
            nuget_password=${{ secrets.githubToken }}
          dockerfilePath: ${{ inputs.dockerfilePath }}
          migrationsDockerfileContext: ${{ inputs.migrationsDockerfileContext }}
          migrationsDockerfilePath: ${{ inputs.migrationsDockerfilePath }}

      - name: Update ArgoCD
        if: inputs.imageName != ''
        uses: stand-sure-org/Oui-DELIVER/.github/actions/update-argocd@feat/dotnet11-standalone
        with:
          githubToken: ${{ secrets.githubToken }}
          repoName: ${{ inputs.argoCdRepoName }}
          version: ${{ needs.version.outputs.version }}
          folderName: ${{ inputs.folderName || github.event.repository.name }}

      - name: Create Job Summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ needs.version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Repository | ${{ github.repository }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Skip Tests | ${{ needs.detect.outputs.skip_tests }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Has Package | ${{ needs.detect.outputs.has_package }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Has Docker | ${{ needs.detect.outputs.has_docker }} |" >> $GITHUB_STEP_SUMMARY

  generate_provenance:
    needs: build
    if: inputs.slsa && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    uses: stand-sure-org/Oui-DELIVER/.github/workflows/generate-provenance.yaml@feat/dotnet11-standalone
    permissions:
      attestations: write
      id-token: write
      actions: read
      contents: write
