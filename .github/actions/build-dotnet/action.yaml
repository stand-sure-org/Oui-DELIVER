name: "Build DotNet"
description: "Builds a solution"
inputs:
  organization:
    description: 'GitHub organization whose GitHub Packages NuGet feed is added before restore. Empty means use the repo''s own NuGet config only.'
    required: false
    default: ''
  version:
    required: true
    description: "Version"
  minimumCoverage:
    required: false
    description: "Minimum code coverage percentage"
    default: "0"
  githubToken:
    required: true
    description: "Github Token for publish"
  
  testProjectPath:
    required: true
    description: "Test project discovery is from the solution if this is not set."
    default: "."
  dotnet-version:
    required: false
    description: ".NET SDK version(s) to install - a multi-line string"
    default: |
      8.x
      9.x
      10.x
  testArguments:
    required: false
    description: "Extra arguments for dotnet test when the repo's global.json selects Microsoft.Testing.Platform (for example --report-xunit-trx)."
    default: ''
runs:
  using: "composite"
  steps:
    - name: Setup .NET (global.json)
      # A repo that pins its SDK in global.json gets that SDK plus the listed versions.
      if: hashFiles('global.json') != ''
      uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
      with:
        global-json-file: global.json
        dotnet-version: ${{ inputs.dotnet-version }}
    - name: Setup .NET
      if: hashFiles('global.json') == ''
      uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
    - name: Cache NuGet packages
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      with:
        path: ~/.nuget/packages        
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    - name: Build
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        MINIMUM_COVERAGE: ${{ inputs.minimumCoverage }}
        REPORTS_PATH: test/results
        TEST_PROJECT_PATH: "${{ inputs.testProjectPath }}"
        GHCR_USER: ${{ github.actor }}
        GHCR_TOKEN: ${{ inputs.githubToken }}
        GITHUB_TOKEN: ${{ inputs.githubToken }}
        # NuGet auth via env var - no cleartext password storage needed
        # See: https://learn.microsoft.com/en-us/nuget/reference/nuget-config-file#packagesourcecredentials
        NuGetPackageSourceCredentials_github: "Username=${{ github.actor }};Password=${{ inputs.githubToken }}"
        NUGET_FEED_ORG: ${{ inputs.organization }}
        TEST_ARGUMENTS: ${{ inputs.testArguments }}
      run: |
        set -euo pipefail
        if [[ -n "${NUGET_FEED_ORG}" ]]; then
          # Add GitHub Packages source idempotently (remove first so re-runs on
          # self-hosted or cached runners do not fail with "source already exists")
          if dotnet nuget list source | grep -q '^  github '; then
            dotnet nuget remove source github
          fi
          dotnet nuget add source \
            --name "github" \
            "https://nuget.pkg.github.com/${NUGET_FEED_ORG}/index.json"
        fi

        dotnet restore
        dotnet build --configuration Release --no-restore /p:Version="$VERSION"

        # Microsoft.Testing.Platform (global.json "test": { "runner": ... }) takes
        # different dotnet test arguments from VSTest: no --logger/--collect/
        # --test-adapter-path, and a path goes through --solution/--project.
        if [[ -f global.json ]] && jq -e '.test.runner == "Microsoft.Testing.Platform"' global.json >/dev/null 2>&1; then
          echo "::notice::global.json selects Microsoft.Testing.Platform"
          if [[ "${MINIMUM_COVERAGE}" != "0" ]]; then
            echo "::warning::minimumCoverage is not enforced under Microsoft.Testing.Platform by this action"
          fi
          target=()
          case "${TEST_PROJECT_PATH}" in
            .|"") ;;
            *.sln|*.slnx) target=(--solution "${TEST_PROJECT_PATH}") ;;
            *) target=(--project "${TEST_PROJECT_PATH}") ;;
          esac
          read -r -a extra <<< "${TEST_ARGUMENTS}"
          dotnet test "${target[@]}" \
            --configuration Release \
            --no-build \
            --results-directory "$PWD/$REPORTS_PATH" \
            "${extra[@]}"
          exit 0
        fi

        dotnet test ${TEST_PROJECT_PATH} \
          --no-restore \
          --configuration Release \
          --test-adapter-path:. \
          --logger:"trx;LogFileName=test_results.trx" \
          /p:CollectCoverage=true \
          /p:Threshold="$MINIMUM_COVERAGE" \
          /p:ThresholdType=line \
          /p:ThresholdStat=total \
          --collect:"XPlat Code Coverage;Format=cobertura,opencover" \
          --results-directory="$REPORTS_PATH"
    - name: ReportGenerator
      if: ${{ hashFiles('**/coverage.opencover.xml') != '' }}
      uses: im-open/code-coverage-report-generator@4a07a939910b02a25199c538778e8b38607dbcf5 # v5.0.0
      with:
        reports: '*/**/coverage.opencover.xml'
        reporttypes: 'Html;MarkdownSummary'
        assemblyfilters: '-xunit*;-Dapper;'
        classfilters: '+*'
        filefilters: '-Startup.cs;-Program.cs;-*.cshtml'
        verbosity: 'Warning'
        targetdir: 'test/results/coverage'
    - name: Output to markdown
      if: ${{ hashFiles('test/results/coverage/Summary.md') != '' }}
      shell: bash
      run: cat test/results/coverage/Summary.md >> $GITHUB_STEP_SUMMARY
    - name: Test Report
      uses: dorny/test-reporter@6e6a65b7a0bd2c9197df7d0ae36ac5cee784230c # v2.0.0
      if: ${{ hashFiles('test/results/**/*.trx') != '' }}
      with:
        name: dotnet tests
        path: "test/results/**/*.trx"
        reporter: dotnet-trx
