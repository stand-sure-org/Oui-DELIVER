name: "Push NuGet packages"
description: "Uploads NuGet packages to GitHub"
inputs:
  organization:
    description: 'GitHub organization for package registry'
    required: false
    default: '${{ github.repository_owner }}'
  searchPath:
    description: 'Directory to search for .nupkg files. Default keeps the original bin/Release search.'
    required: false
    default: ''
  pushToken:
    required: true
    description: "GitHub token"
runs:
  using: "composite"
  steps:
    - name: Push Nuget packages
      shell: bash
      env: 
        PUSH_TOKEN: "${{ inputs.pushToken }}"
        SEARCH_PATH: "${{ inputs.searchPath }}"
        FEED_ORG: "${{ inputs.organization }}"
      run: |
        set -euo pipefail
        if [[ -n "${SEARCH_PATH}" ]]; then
          finder=(find "${SEARCH_PATH}" -name '*.nupkg' -not -name '*.symbols.nupkg' -print0)
        else
          finder=(find . -path '**/bin/Release/*.nupkg' -not -path '*/EmptyFiles/*' -not -path '*/tests/*' -print0)
        fi
        "${finder[@]}" | while IFS= read -r -d $'\0' file; do
          echo "Pushing ${file} to ${FEED_ORG}"
          dotnet nuget push "$file" \
            --source "https://nuget.pkg.github.com/${FEED_ORG}/index.json" \
            --api-key "${PUSH_TOKEN}" \
            --skip-duplicate
        done